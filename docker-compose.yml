services:
  observe:
    build: .
    container_name: observe-compare
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123   # 每次启动都会以此同步管理员密码（会覆盖页面上改过的密码）
    restart: unless-stopped
